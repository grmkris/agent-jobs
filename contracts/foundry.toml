[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Monad verification wants metadata present but unhashed (docs.monad.xyz/guides/verify-smart-contract/foundry).
# These keys need Foundry >= 1.8; older versions warn and ignore them.
metadata = true
metadata_hash = "none"
use_literal_content = true

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
